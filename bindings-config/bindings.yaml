# Main hs-bindgen configuration for PipeWire bindings

# Specify which headers to process
headers:
  - path: "<pipewire/pipewire.h>"
    module: "PipeWire"
  - path: "<pipewire/core.h>"
    module: "PipeWire.Raw.Core"
  - path: "<pipewire/context.h>"
    module: "PipeWire.Raw.Context"
  - path: "<pipewire/loop.h>"
    module: "PipeWire.Raw.Loop"
  - path: "<pipewire/node.h>"
    module: "PipeWire.Raw.Node"
  - path: "<pipewire/port.h>"
    module: "PipeWire.Raw.Port"
  - path: "<pipewire/link.h>"
    module: "PipeWire.Raw.Link"
  - path: "<pipewire/registry.h>"
    module: "PipeWire.Raw.Registry"

# Additional clang arguments
clang-args:
  - "-I/usr/include/pipewire-0.3"
  - "-I/usr/include/spa-0.2"

# Type mappings
types:
  # Include custom type mappings
  include: ["custom-types.yaml"]

  # Basic type mappings
  mappings:
    - c-type: "int"
      hs-type: "CInt"
    - c-type: "char *"
      hs-type: "CString"
    - c-type: "void *"
      hs-type: "Ptr ()"

# Function filtering
functions:
  # Include all functions that begin with 'pw_'
  include:
    - pattern: "pw_*"

# Output options
output:
  # Add standard header to generated files
  header: |
    {-# LANGUAGE ForeignFunctionInterface #-}
    {-# LANGUAGE CApiFFI #-}
    -- Generated by hs-bindgen. Do not edit manually.
  
  # Add common imports to generated files
  imports: |
    import Foreign
    import Foreign.C
